<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRYPTEX — Live Market Feed</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="scanline"></div>

  <header>
    <div class="logo">
      <span class="logo-bracket">[</span>CRYPTEX<span class="logo-bracket">]</span>
      <span class="logo-sub">MARKET TERMINAL v1.0</span>
    </div>
    <div class="header-right">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText" class="status-text">CONNECTING...</span>
      <span class="divider">|</span>
      <span id="lastUpdated" class="last-updated">--:--:--</span>
    </div>
  </header>

  <main>
    <div class="controls">
      <input type="text" id="searchBox" class="search-box" placeholder="SEARCH COIN..."/>
      <div class="sort-controls">
        <span class="sort-label">SORT:</span>
        <button class="sort-btn active" data-sort="market_cap_rank">RANK</button>
        <button class="sort-btn" data-sort="current_price">PRICE</button>
        <button class="sort-btn" data-sort="price_change_percentage_24h">24H%</button>
        <button class="sort-btn" data-sort="market_cap">MKT CAP</button>
      </div>
      <button class="refresh-btn" id="refreshBtn">⟳ REFRESH</button>
    </div>

    <div class="table-wrapper">
      <table id="cryptoTable">
        <thead>
          <tr>
            <th>#</th>
            <th>ASSET</th>
            <th>PRICE (USD)</th>
            <th>24H CHANGE</th>
            <th>MARKET CAP</th>
            <th>24H VOLUME</th>
            <th>SUPPLY</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="7" class="loading-row">
            <span class="loading-text">FETCHING MARKET DATA</span>
            <span class="dots"><span>.</span><span>.</span><span>.</span></span>
          </td></tr>
        </tbody>
      </table>
    </div>

    <div class="ticker-bar">
      <div class="ticker-inner" id="tickerInner">Loading ticker...</div>
    </div>
  </main>

  <footer>
    <span>DATA: COINGECKO API</span>
    <span class="divider">|</span>
    <span>AUTO-REFRESH: <span id="countdown">60</span>s</span>
    <span class="divider">|</span>
    <span>BUILT WITH PYTHON / FLASK</span>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
